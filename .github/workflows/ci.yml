name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    # vitest 5 needs Node 22.12+, so the test suite runs on 22 and 24 (Linux and Windows)
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci builds dist/ through the prepare script
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node dist/cli.js examples/next-nest/atlas.workspace.json --out atlas.html

  # the published CLI supports Node 20: build it there and run it on the example
  smoke-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node dist/cli.js examples/next-nest/atlas.workspace.json --out atlas.html
      - run: node dist/cli.js init --yes --dir atlas-smoke --repo examples/next-nest/web --repo examples/next-nest/api

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke-node20]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
