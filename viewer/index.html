<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* layout: 왼쪽 조작 패널 + 가운데 그래프 캔버스 + 오른쪽 상세 패널 (좁으면 위아래로 쌓음) */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --fg: #1b2230;
  --muted: #5e6879;
  --line: #dbe0e8;
  --accent: #d9480f;
  --edge: #8a94a6;
  --canvas: #fbfcfd;
  --iface: #e8590c;
  --ok: #2f855a;
  --danger: #d6336c;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --panel: #171d26; --fg: #e2e7ef; --muted: #96a1b3; --line: #29313d;
    --accent: #ff8a4c; --edge: #6d7789; --canvas: #131820; --iface: #ff922b; --danger: #f06595; --ok: #69db7c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --panel: #171d26; --fg: #e2e7ef; --muted: #96a1b3; --line: #29313d;
  --accent: #ff8a4c; --edge: #6d7789; --canvas: #131820; --iface: #ff922b; --danger: #f06595; --ok: #69db7c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 13.5px; }
.app { height: 100%; display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header .meta { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
header #editor { margin-left: auto; padding: 4px 8px; font-size: 12.5px; }
header #lang, header .theme { padding: 4px 10px; font-size: 12.5px; }
.detail .open-editor { display: inline-block; margin-top: 8px; text-decoration: none; font-size: 12.5px; }
aside { background: var(--panel); overflow-y: auto; padding: 14px 16px; display: grid; gap: 18px; align-content: start; min-width: 0; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); }
[hidden] { display: none !important; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
#cy, #focus { position: absolute; inset: 0; }
/* 분석 탭: 중복 · 순환 목록 */
#analysis { position: absolute; inset: 0; overflow-y: auto; padding: 16px 20px; display: grid; gap: 10px; align-content: start; }
.an-item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.an-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.an-head b { color: var(--fg); font-size: 13px; }
.an-badge { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; }
.an-badge.same { border-color: var(--ok); color: var(--ok); }
.an-badge.diff { border-color: var(--muted); }
.an-members { display: grid; gap: 6px; }
.an-members.pair { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.an-fn { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; background: var(--bg); }
.an-fn .dot { width: 9px; height: 9px; border-radius: 50%; }
.an-fn .nm { border: 0; background: none; color: var(--fg); font: inherit; font-weight: 600; text-align: left; cursor: pointer; padding: 0; overflow-wrap: anywhere; }
.an-fn .nm:hover { text-decoration: underline; }
.an-fn .where { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; overflow-wrap: anywhere; }
.an-path { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; }
.an-path button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.an-path button:hover { border-color: var(--accent); }
.an-path .arrow { color: var(--muted); }
.an-kinds label { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.an-kinds .n { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; }
.panel { display: grid; gap: 18px; align-content: start; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.tabs button { border: 0; background: transparent; color: var(--fg); padding: 5px 14px; font: inherit; cursor: pointer; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
.tree { font-size: 13px; display: grid; gap: 1px; }
.tree .row { display: grid; grid-template-columns: 14px 9px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
.tree .row:hover { background: var(--bg); }
.tree .row.on { background: var(--bg); outline: 1px solid var(--accent); }
.tree .caret { color: var(--muted); font-size: 10px; text-align: center; }
.tree .dot { width: 8px; height: 8px; border-radius: 50%; }
.tree .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .sym .name { font-family: var(--f-mono); font-size: 12px; }
.tree .cnt { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.tree .kids { padding-left: 14px; display: grid; gap: 1px; }
.results { display: grid; gap: 1px; }
.results button { text-align: left; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 5px 6px; border-radius: 5px; cursor: pointer; display: grid; grid-template-columns: 9px minmax(0, 1fr); gap: 8px; align-items: center; }
.results button:hover { background: var(--bg); }
.results small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-bar { position: absolute; top: 10px; left: 12px; z-index: 2; display: flex; gap: 8px; align-items: center; }
.focus-bar .btn { background: var(--panel); padding: 4px 10px; font-size: 12.5px; }
.tip { position: fixed; z-index: 10; max-width: 420px; padding: 8px 10px; border-radius: 7px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.18); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; pointer-events: none; }
.tip b { display: block; font-family: var(--f-mono); font-size: 12px; margin-bottom: 4px; }
.tip small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 11px; margin-top: 4px; }
.detail .doc { white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; margin: 8px 0 0; padding: 8px 10px; border-left: 3px solid var(--line); color: var(--fg); }
.col-head { position: absolute; top: 44px; z-index: 1; color: var(--muted); font-size: 11.5px; letter-spacing: .06em; pointer-events: none; }
.label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 6px 0; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="search"] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); font: inherit; }
.legend { display: grid; gap: 4px; }
.legend label { display: grid; grid-template-columns: auto 12px 1fr auto; align-items: center; gap: 8px; cursor: pointer; padding: 3px 0; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend .n { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
/* 기능 계층: repo > 그룹 > 기능. 줄 앞 ▸ 를 누르면 접힌다 */
.legend details > summary { list-style: none; display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 2px; cursor: pointer; }
.legend details > summary::-webkit-details-marker { display: none; }
/* 접기 · 펼치기: 누르기 쉬운 24px 칸 */
.legend details > summary::before {
  content: '▸'; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px;
  color: var(--fg); font-size: 14px; line-height: 1;
}
.legend details > summary:hover::before { background: var(--line); }
.legend details[open] > summary::before { content: '▾'; }
.legend .kids { display: grid; gap: 4px; padding-left: 14px; border-left: 1px solid var(--line); margin-left: 12px; }
.legend .grp > span:nth-child(3) { font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opts label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.keys { display: grid; gap: 4px; color: var(--muted); font-size: 12.5px; }
.keys span { display: inline-flex; align-items: center; gap: 8px; }
.keys i { display: inline-block; width: 26px; border-top: 2px solid var(--edge); }
.keys i.render { border-top-width: 4px; }
.keys i.import { border-top-style: dashed; }
.btn { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 7px; padding: 6px 10px; font: inherit; cursor: pointer; }
.detail h2 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
.detail .kind { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.detail .path { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; margin: 6px 0 0; }
.detail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.detail li button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 4px 6px; border-radius: 5px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.detail li button:hover { background: var(--bg); }
.detail li .dot { width: 8px; height: 8px; border-radius: 50%; }
.detail li .c { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.empty { color: var(--muted); }
.warn { color: var(--accent); font-size: 12.5px; }
.warnings { display: grid; gap: 2px; max-height: 220px; overflow-y: auto; }
.warnings button { text-align: left; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 4px 6px; border-radius: 5px; cursor: pointer; display: grid; gap: 1px; }
.warnings button:hover { background: var(--bg); }
.warnings small { color: var(--danger); font-size: 11.5px; }
.detail .note { color: var(--danger); margin: 6px 0 0; font-size: 12.5px; }
.keys i.iface { border-top: 3px solid var(--iface); }
.keys i.sock { border-top: 2px dotted var(--iface); }
.canvas-note { position: absolute; inset: 0; margin: auto; height: fit-content; max-width: 28ch; text-align: center; color: var(--muted); z-index: 1; pointer-events: none; }
.legend-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.legend-actions .btn { padding: 3px 8px; font-size: 12px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 60vh auto; }
  aside.left, aside.right { border: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Code Atlas</h1>
    <div class="tabs" role="group" data-i18n-aria="view">
      <button id="tab-focus" aria-pressed="true" data-i18n="tab.focus">Focus</button>
      <button id="tab-map" aria-pressed="false" data-i18n="tab.map">Full map</button>
      <button id="tab-analysis" aria-pressed="false" data-i18n="tab.analysis">Analysis</button>
    </div>
    <span class="meta" id="meta"></span>
    <select id="editor" class="btn" data-i18n-aria="editor.aria"></select>
    <button class="btn" id="lang" type="button">한국어</button>
    <button class="btn theme" id="theme" type="button">Theme: system</button>
  </header>

  <aside class="left">
   <div class="panel" id="panel-focus">
    <div>
      <div class="label" data-i18n="search">Search</div>
      <input type="search" id="fx-search" data-i18n-ph="fx.searchPh" autocomplete="off">
    </div>
    <div>
      <div class="label" data-i18n="fx.unit">Unit</div>
      <div class="seg" role="group" data-i18n-aria="fx.unit">
        <button id="fx-file" aria-pressed="true" data-i18n="unit.file">File</button>
        <button id="fx-fn" aria-pressed="false" data-i18n="unit.fn">Function</button>
      </div>
    </div>
    <div>
      <div class="label" data-i18n="fx.depth">Depth</div>
      <div class="seg" role="group" data-i18n-aria="fx.depth">
        <button id="fx-d1" aria-pressed="true" data-i18n="fx.d1">1 hop</button>
        <button id="fx-d2" aria-pressed="false" data-i18n="fx.d2">2 hops</button>
      </div>
      <div class="opts" style="margin-top:8px">
        <label><input type="checkbox" id="fx-imports" autocomplete="off"> <span data-i18n="fx.imports">Also show import-only relations</span></label>
      </div>
    </div>
    <div>
      <div class="label" data-i18n="fx.features">Features (unchecked ones are hidden)</div>
      <div class="legend-actions"><button class="btn" id="fx-all" data-i18n="all">All on</button><button class="btn" id="fx-none" data-i18n="none">All off</button><button class="btn" data-fold="fx-legend" data-open="1" data-i18n="expand">Expand</button><button class="btn" data-fold="fx-legend" data-i18n="collapse">Collapse</button></div>
      <div class="legend" id="fx-legend"></div>
    </div>
    <div>
      <div class="label" data-i18n="fx.files">Files</div>
      <div class="results" id="fx-results" hidden></div>
      <div class="tree" id="fx-tree"></div>
    </div>
   </div>
   <div class="panel" id="panel-map" hidden>
    <div>
      <div class="label" data-i18n="map.level">Level</div>
      <div class="seg" role="group" data-i18n-aria="map.level">
        <button id="lv-file" aria-pressed="true" data-i18n="unit.file">File</button>
        <button id="lv-fn" aria-pressed="false" data-i18n="unit.fn">Function</button>
      </div>
      <p class="empty" style="margin:8px 0 0;font-size:12.5px" data-i18n="map.dblclick">Double-click a node to expand or collapse it.</p>
      <p class="warn" id="warn" hidden></p>
    </div>
    <div>
      <div class="label" data-i18n="search">Search</div>
      <input type="search" id="search" list="names" data-i18n-ph="map.searchPh" autocomplete="off">
      <datalist id="names"></datalist>
    </div>
    <div>
      <div class="label" data-i18n="map.features">Features</div>
      <div class="legend-actions"><button class="btn" id="ft-all" data-i18n="all">All on</button><button class="btn" id="ft-none" data-i18n="none">All off</button><button class="btn" data-fold="legend" data-open="1" data-i18n="expand">Expand</button><button class="btn" data-fold="legend" data-i18n="collapse">Collapse</button></div>
      <div class="legend" id="legend"></div>
    </div>
    <div>
      <div class="label" data-i18n="map.display">Display</div>
      <div class="opts">
        <label><input type="checkbox" id="opt-cross"> <span data-i18n="map.cross">Highlight edges across features</span></label>
        <label><input type="checkbox" id="opt-import" checked> <span data-i18n="map.imports">Show import-only edges</span></label>
        <label><input type="checkbox" id="opt-hop2"> <span data-i18n="map.hop2">Highlight 2 hops on select</span></label>
        <label id="opt-iface-row" hidden><input type="checkbox" id="opt-iface"> <span data-i18n="map.ifaceOnly">Only what touches interfaces</span></label>
      </div>
    </div>
    <div id="warn-box" hidden>
      <div class="label" id="warn-title">Unmatched interfaces</div>
      <div class="warnings" id="warnings"></div>
    </div>
    <div>
      <div class="label" data-i18n="map.edges">Edges</div>
      <div class="keys">
        <span><i></i><span data-i18n="edge.call">Call</span></span>
        <span><i class="render"></i><span data-i18n="edge.render">JSX render</span></span>
        <span><i class="import"></i><span data-i18n="edge.import">Import only</span></span>
        <span><i class="iface"></i><span data-i18n="edge.http">HTTP request · handler</span></span>
        <span><i class="sock"></i><span data-i18n="edge.socket">Socket emit · listen</span></span>
      </div>
    </div>
    <button class="btn" id="relayout" data-i18n="map.relayout">Re-layout</button>
   </div>
   <div class="panel" id="panel-analysis" hidden>
    <div>
      <div class="label" data-i18n="search">Search</div>
      <input type="search" id="an-search" data-i18n-ph="an.searchPh" autocomplete="off">
    </div>
    <div>
      <div class="label" data-i18n="an.kinds">Show</div>
      <div class="an-kinds opts">
        <label><span><input type="checkbox" id="an-dups" checked autocomplete="off"> <span data-i18n="an.dups">Duplicate functions</span></span><span class="n" id="an-n-dups"></span></label>
        <label><span><input type="checkbox" id="an-calls" checked autocomplete="off"> <span data-i18n="an.calls">Call cycles</span></span><span class="n" id="an-n-calls"></span></label>
        <label><span><input type="checkbox" id="an-imports" checked autocomplete="off"> <span data-i18n="an.imports">Import cycles</span></span><span class="n" id="an-n-imports"></span></label>
      </div>
    </div>
    <div>
      <div class="label"><span data-i18n="an.minSim">Minimum similarity</span> <span id="an-sim-v"></span></div>
      <input type="range" id="an-sim" min="50" max="100" step="1" autocomplete="off">
      <label id="an-jev-row" hidden style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="an-jev" autocomplete="off"> <span data-i18n="an.jevOnly">Only those Jev judged the same</span></label>
    </div>
    <div>
      <div class="label" data-i18n="an.features">Features</div>
      <div class="legend-actions"><button class="btn" id="an-all" data-i18n="all">All on</button><button class="btn" id="an-none" data-i18n="none">All off</button></div>
      <div class="legend" id="an-legend"></div>
    </div>
   </div>
  </aside>

  <div class="stage">
    <div id="focus" data-i18n-aria="fx.aria"></div>
    <div class="focus-bar" id="focus-bar"><button class="btn" id="fx-back" disabled data-i18n="fx.back">← Back</button></div>
    <div id="cy" data-i18n-aria="map.aria" hidden></div>
    <div id="analysis" hidden></div>
  </div>

  <aside class="right detail" id="detail">
    <p class="empty"></p>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script id="atlas-data" type="application/json">/*__ATLAS_DATA__*/</script>
<script>
(() => {
  const G = JSON.parse(document.getElementById('atlas-data').textContent);
  const KIND = new Proxy({}, { get: (_, k) => T(`kind.${String(k)}`) });
  const BIG = 2500;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // graph.json 은 외부에서 받을 수도 있으므로 style 에 들어가는 색은 #hex 만 쓴다
  const safeColor = (c) => (/^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#9aa3b2');


  // ---------- 언어 (영어 기본, 한국어) ----------
  const I18N = {
    en: {
      view: 'View', 'tab.focus': 'Focus', 'tab.map': 'Full map', 'tab.analysis': 'Analysis',
